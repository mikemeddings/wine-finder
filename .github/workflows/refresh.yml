name: Refresh wine lists

# Monthly. Scheduled runs refresh only the stores due that month (refresh.py --scheduled):
# Lucullus every month; BC, ZYN and BSW in Jan, Apr, Jul and Oct (BC publishes about
# quarterly). The "Run workflow" button on the Actions tab refreshes every store.
on:
  schedule:
    - cron: "17 10 1 * *"   # 10:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write   # to commit the refreshed data/ files

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the Calgary stores are read politely: about 8 minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # A store that fails keeps its previous data (refresh.py exits 1); the others
      # still update. The job is marked failed at the end so the problem is noticed.
      - name: Refresh
        id: refresh
        run: |
          args=""; if [ "${{ github.event_name }}" = "schedule" ]; then args="--scheduled"; fi
          if python scripts/refresh.py $args; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::A store could not be refreshed; see the log above."; fi

      - name: Test
        run: python -m pytest scripts -q

      - name: Commit changed data
        run: |
          git add data/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh wine lists ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push

      - name: Report a failed store
        if: steps.refresh.outputs.ok == 'false'
        run: exit 1
